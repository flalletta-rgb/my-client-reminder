<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>My Client Reminder</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f7fc;background:#08090d}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}header{padding:20px 18px;background:#181a22;display:flex;align-items:center;justify-content:space-between}header strong{font-size:18px}header small{display:block;color:#a8aaba;margin-top:4px}main{padding:20px 16px;max-width:640px;margin:auto}h1{font-size:24px;margin:0 0 20px}h2{font-size:17px;margin:24px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border-radius:15px;padding:16px 6px;text-align:center}.stat b{display:block;font-size:28px}.stat span{font-size:12px}.purple{background:#6943d1}.orange{background:#c47a24}.green{background:#168c71}.blue{background:#1678bf}.card{background:#1b1d26;padding:15px;border-radius:15px;margin:10px 0;display:flex;gap:12px;align-items:center}.card .body{flex:1;min-width:0}.card strong{display:block;overflow-wrap:anywhere}.muted{color:#adb0bf;font-size:13px;margin-top:5px}.btn{border:0;border-radius:13px;padding:15px 16px;color:white;font-weight:700;font-size:15px;cursor:pointer}.btn:disabled{opacity:.4}.wide{width:100%;margin-top:12px}.secondary{background:#292c38}.danger{background:#9f3e54}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.field{display:block;margin:14px 0 5px;font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid #444653;background:#20222d;color:white;padding:14px;border-radius:12px;font-size:16px;color-scheme:dark}textarea{min-height:76px}input[type=checkbox]{width:22px;height:22px;accent-color:#26b18b;flex-shrink:0}input[type=date]{min-height:49px}nav{position:fixed;bottom:0;left:0;right:0;background:#101117;border-top:1px solid #30313b;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;border:0;border-radius:12px;background:#292c38;color:white;padding:12px 4px;font-weight:600}nav button.active:nth-child(1){background:#6943d1}nav button.active:nth-child(2){background:#1678bf}nav button.active:nth-child(3){background:#c47a24}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.tiny{padding:9px 11px;font-size:13px}.pill{display:inline-block;background:#393047;color:#dfcaff;border-radius:20px;padding:5px 10px;font-size:12px}.done{text-decoration:line-through;opacity:.55}.empty{padding:28px;text-align:center;color:#a8aaba;background:#1b1d26;border-radius:16px}.warning{border:1px solid #b8863d;border-radius:13px;padding:12px;color:#f2d39c;font-size:13px;margin-top:16px}.datebar{display:flex;gap:8px;align-items:center}.datebar input{flex:1}button:focus-visible,input:focus-visible{outline:2px solid #b49cff;outline-offset:2px}
</style></head><body><header><div><strong>🗓️ Berto's List</strong><small>Il tuo assistente clienti</small></div><button class="btn secondary tiny" onclick="show('settings')" aria-label="Impostazioni">⚙️</button></header><main id="app"></main><nav><button id="nav-home" onclick="show('home')">⌂<br>Oggi</button><button id="nav-clients" onclick="show('clients')">♙<br>Clienti</button><button id="nav-calendar" onclick="show('calendar')">▦<br>Calendario</button></nav><script>
'use strict';const KEY='mcr_clients_v1';let clients=[];try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))clients=a}catch(e){alert('Archivio non leggibile: non modificare i dati prima di recuperare un backup.')}let page='home',selected=null,calendarDay=new Date().toLocaleDateString('en-CA'),filter='';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};calendarDay=today();const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}):'Senza data';const tasks=()=>clients.flatMap(c=>(c.tasks||[]).map(t=>({...t,client:c.name,clientId:c.id})));function save(){try{localStorage.setItem(KEY,JSON.stringify(clients));return true}catch(e){alert('Salvataggio non riuscito: spazio esaurito o memoria bloccata. Esporta subito un backup.');return false}}function show(p,id){page=p;if(id!==undefined)selected=id;render()}function nav(){['home','clients','calendar'].forEach(p=>document.getElementById('nav-'+p).classList.toggle('active',page===p))}function render(){nav();const pending=tasks().filter(t=>!t.done);if(page==='home'){const due=pending.filter(t=>t.date<=today()).sort((a,b)=>a.date.localeCompare(b.date));app.innerHTML=`<h1>Le tue attività ✨</h1><div class="stats"><div class="stat purple"><b>${clients.length}</b><span>Clienti</span></div><div class="stat orange"><b>${pending.length}</b><span>Da fare</span></div><div class="stat green"><b>${tasks().filter(t=>t.done).length}</b><span>Completate</span></div></div><h2>Oggi e arretrate (${due.length})</h2>${due.length?due.map(taskCard).join(''):'<div class="empty">Nessuna attività in scadenza 🎉</div>'}<h2>Prossime attività</h2>${pending.filter(t=>t.date>today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10).map(taskCard).join('')||'<div class="empty">Nessuna attività futura</div>'}<button class="btn purple wide" onclick="newClient()">＋ Nuovo cliente</button>`}else if(page==='clients'){app.innerHTML=`<div class="top"><h1>Rubrica clienti</h1><button class="btn purple tiny" onclick="newClient()">＋ Aggiungi</button></div><input id="search" placeholder="Cerca nome o telefono" value="${esc(filter)}" oninput="filter=this.value;listClients()"><div id="clientlist"></div>`;listClients()}else if(page==='new'){app.innerHTML=`<h1>Nuovo cliente</h1><form id="newform"><label class="field" for="cname">Nome e cognome *</label><input id="cname" required maxlength="120" autocomplete="off"><label class="field" for="ctel">Telefono</label><input id="ctel" type="tel" maxlength="40"><label class="field" for="ctype">Tipo di attivazione</label><select id="ctype"><option>Rete fissa</option><option>Mobile</option><option>Luce e gas</option><option>Altro</option></select><label class="field" for="cnotes">Note (evita dati sensibili)</label><textarea id="cnotes" maxlength="1000"></textarea><button class="btn green wide" type="submit">✓ Salva cliente e aggiungi attività</button></form><button class="btn secondary wide" onclick="show('clients')">Annulla</button>`;document.getElementById('newform').onsubmit=createClient}else if(page==='detail'){const c=clients.find(x=>x.id===selected);if(!c){show('clients');return}app.innerHTML=`<div class="top"><h1>${esc(c.name)}</h1><button class="btn secondary tiny" onclick="show('clients')">← Indietro</button></div><div class="card"><div class="body"><strong>${esc(c.type)}</strong><div class="muted">${esc(c.phone||'Telefono non inserito')}</div>${c.phone?`<a style="color:#b59aff" href="tel:${esc(c.phone.replace(/[^+\d]/g,''))}">Chiama cliente</a>`:''}${c.notes?`<div class="muted">${esc(c.notes)}</div>`:''}</div></div><h2>Checklist attività</h2>${(c.tasks||[]).map(t=>`<div class="card"><input type="checkbox" aria-label="Completa attività" ${t.done?'checked':''} onchange="toggleTask(${c.id},${t.id})"><div class="body"><strong class="${t.done?'done':''}">${esc(t.title)}</strong><div class="muted">${fmt(t.date)}</div></div><button class="btn secondary tiny" onclick="editTask(${c.id},${t.id})">✎</button><button class="btn danger tiny" onclick="deleteTask(${c.id},${t.id})">×</button></div>`).join('')||'<div class="empty">Aggiungi il primo promemoria</div>'}<h2>Aggiungi attività</h2><form id="taskform"><label class="field" for="tasktitle">Attività *</label><select id="preset" onchange="document.getElementById('tasktitle').value=this.value"><option value="">Scegli un modello (facoltativo)</option><option>Primo contatto post-attivazione</option><option>Consulenza luce e gas</option><option>Verifica prima bolletta</option><option>Verifica attivazione</option></select><input id="tasktitle" style="margin-top:8px" placeholder="Descrizione attività" required maxlength="160"><label class="field" for="taskdate">Data promemoria *</label><input id="taskdate" type="date" value="${today()}" required><button class="btn green wide" type="submit">＋ Aggiungi attività</button></form><button class="btn purple wide" onclick="show('home')">✓ Salva e torna alla Home</button><button class="btn blue wide" onclick="newClient()">＋ Salva e aggiungi un altro cliente</button><button class="btn secondary wide" onclick="editClient(${c.id})">Modifica dati cliente</button><button class="btn danger wide" onclick="deleteClient(${c.id})">Elimina cliente</button>`;document.getElementById('taskform').onsubmit=e=>{e.preventDefault();c.tasks.push({id:Date.now()+Math.floor(Math.random()*1000),title:document.getElementById('tasktitle').value.trim(),date:document.getElementById('taskdate').value,done:false});if(save())render()}}else if(page==='calendar'){const day=tasks().filter(t=>t.date===calendarDay);app.innerHTML=`<h1>Calendario 📅</h1><label class="field" for="caldate">Seleziona giorno</label><input id="caldate" type="date" value="${calendarDay}" onchange="calendarDay=this.value;render()"><h2>Attività del ${fmt(calendarDay)}</h2>${day.length?day.map(taskCard).join(''):'<div class="empty">Nessuna attività per questo giorno</div>'}<div class="warning">🔔 Notifiche automatiche alle 11:00: non ancora disponibili in questa versione.</div>`}else if(page==='settings'){app.innerHTML=`<h1>Impostazioni ⚙️</h1><h2>Archivio e backup</h2><p class="muted">I dati vengono salvati nella memoria locale di questa web app sul dispositivo. Non cancellare i dati di Safari o l'app senza aver prima esportato un backup.</p><button class="btn blue wide" onclick="exportBackup()">↓ Esporta backup JSON</button><label class="field" for="importfile">Ripristina backup</label><input id="importfile" type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"><div class="warning">⚠️ Conserva il backup in un luogo protetto: contiene nomi e numeri dei clienti. Non caricarlo su servizi non autorizzati dal tuo datore di lavoro.</div><h2>Notifiche</h2><div class="card"><div class="body">Ore 11:00, solo nei giorni con attività programmate<div class="muted">Funzione da implementare: nessuna notifica push è attiva.</div></div></div>`}}
function taskCard(t){return `<div class="card"><input type="checkbox" aria-label="Completa attività" ${t.done?'checked':''} onchange="toggleTask(${t.clientId},${t.id})"><div class="body"><strong class="${t.done?'done':''}">${esc(t.title)}</strong><div class="muted">${esc(t.client)} · ${fmt(t.date)}</div></div><button class="btn secondary tiny" onclick="show('detail',${t.clientId})">›</button></div>`}function listClients(){const el=document.getElementById('clientlist');if(!el)return;const list=clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(filter.toLowerCase()));el.innerHTML=list.map(c=>`<div class="card" onclick="show('detail',${c.id})" role="button" tabindex="0"><div class="body"><strong>${esc(c.name)}</strong><div class="muted">${esc(c.type)} · ${c.tasks.filter(t=>!t.done).length} attività aperte</div></div><span style="color:#b59aff">›</span></div>`).join('')||'<div class="empty">Nessun cliente trovato</div>'}function newClient(){show('new')}function createClient(e){e.preventDefault();const name=document.getElementById('cname').value.trim();if(!name)return;const id=Date.now();clients.push({id,name,phone:document.getElementById('ctel').value.trim(),type:document.getElementById('ctype').value,notes:document.getElementById('cnotes').value.trim(),tasks:[]});if(save())show('detail',id)}function toggleTask(cid,tid){const c=clients.find(c=>c.id===cid),t=c?.tasks.find(t=>t.id===tid);if(t){t.done=!t.done;save();render()}}function deleteTask(cid,tid){if(!confirm('Eliminare questa attività?'))return;const c=clients.find(c=>c.id===cid);c.tasks=c.tasks.filter(t=>t.id!==tid);save();render()}function editTask(cid,tid){const t=clients.find(c=>c.id===cid)?.tasks.find(t=>t.id===tid);if(!t)return;const title=prompt('Descrizione attività',t.title);if(title===null||!title.trim())return;const date=prompt('Data nel formato AAAA-MM-GG',t.date);if(date===null||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())){alert('Data non valida');return}t.title=title.trim();t.date=date;save();render()}function editClient(id){const c=clients.find(c=>c.id===id);const name=prompt('Nome e cognome',c.name);if(name===null||!name.trim())return;const phone=prompt('Telefono',c.phone);if(phone===null)return;const notes=prompt('Note',c.notes||'');if(notes===null)return;c.name=name.trim();c.phone=phone.trim();c.notes=notes.trim();save();render()}function deleteClient(id){if(!confirm('Eliminare il cliente e tutte le sue attività?'))return;clients=clients.filter(c=>c.id!==id);save();show('clients')}function exportBackup(){const blob=new Blob([JSON.stringify({app:'My Client Reminder',version:1,exported:new Date().toISOString(),clients},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-client-reminder-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importBackup(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='My Client Reminder'||!Array.isArray(obj.clients)||!obj.clients.every(c=>typeof c.id==='number'&&typeof c.name==='string'&&Array.isArray(c.tasks)&&c.tasks.every(t=>typeof t.id==='number'&&typeof t.title==='string'&&typeof t.date==='string'&&typeof t.done==='boolean')))throw Error('Formato non riconosciuto');if(!confirm('Il ripristino sostituirà tutti i clienti attuali. Continuare?'))return;clients=obj.clients;save();show('home');alert('Backup ripristinato')}catch(e){alert('Impossibile importare il backup: '+e.message)}}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
